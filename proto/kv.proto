syntax = "proto3";

package minikv;

// Internal volume service (coordinator → volume)
service VolumeInternal {
  // 2PC write protocol
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc Abort(AbortRequest) returns (AbortResponse);
  
  // Replication & repair
  rpc Pull(PullRequest) returns (stream Chunk);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  
  // Health & admin
  rpc Ping(PingRequest) returns (PingResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
}

// Coordinator service (volume → coordinator, raft peers)
service CoordinatorInternal {
  // Raft RPCs
  rpc RequestVote(VoteRequest) returns (VoteResponse);
  rpc AppendEntries(AppendRequest) returns (AppendResponse);
  rpc InstallSnapshot(SnapshotRequest) returns (SnapshotResponse);
  
  // Volume registration
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Range queries and batch operations
  rpc Range(RangeRequest) returns (RangeResponse);
  rpc Batch(BatchRequest) returns (BatchResponse);
}

// ===== Range Query Messages =====
message RangeRequest {
  string start = 1;
  string end = 2;
  bool include_values = 3;
}

message RangeResponse {
  repeated string keys = 1;
  repeated bytes values = 2;
}

// ===== Batch Operation Messages =====
message BatchRequest {
  repeated BatchOp ops = 1;
}

message BatchOp {
  enum Type {
    PUT = 0;
    GET = 1;
    DELETE = 2;
  }
  Type type = 1;
  string key = 2;
  bytes value = 3;
}

message BatchResponse {
  repeated BatchResult results = 1;
}

message BatchResult {
  bool ok = 1;
  string key = 2;
  bytes value = 3;
  string error = 4;
}

// ===== 2PC Messages =====

message PrepareRequest {
  string key = 1;
  string upload_id = 2;
  uint64 expected_size = 3;
  string expected_blake3 = 4;
}

message PrepareResponse {
  bool ok = 1;
  string error = 2;
}

message CommitRequest {
  string upload_id = 1;
  string key = 2;
}

message CommitResponse {
  bool ok = 1;
  string error = 2;
}

message AbortRequest {
  string upload_id = 1;
}

message AbortResponse {
  bool ok = 1;
}

// ===== Replication Messages =====

message PullRequest {
  string key = 1;
  string source_url = 2;
}

message Chunk {
  bytes data = 1;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool ok = 1;
  string error = 2;
}

// ===== Health Messages =====

message PingRequest {}

message PingResponse {
  string volume_id = 1;
  uint64 uptime_secs = 2;
  uint64 total_keys = 3;
  uint64 total_bytes = 4;
}

message StatsRequest {}

message StatsResponse {
  uint64 total_keys = 1;
  uint64 total_bytes = 2;
  uint64 free_bytes = 3;
