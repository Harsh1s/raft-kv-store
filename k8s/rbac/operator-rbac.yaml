apiVersion: v1
kind: ServiceAccount
metadata:
  name: minikv-operator
  namespace: minikv-system
  labels:
    app.kubernetes.io/name: minikv-operator
    app.kubernetes.io/component: operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: minikv-operator
  labels:
    app.kubernetes.io/name: minikv-operator
rules:
  - apiGroups: ["minikv.io"]
    resources: ["minikvclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["minikv.io"]
    resources: ["minikvclusters/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["minikv.io"]
    resources: ["minikvclusters/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
