# Basic MiniKV cluster
apiVersion: minikv.io/v1alpha1
kind: MiniKVCluster
metadata:
  name: my-minikv
  namespace: default
spec:
  coordinators:
    replicas: 3
    image: ghcr.io/whispem/minikv-coord:0.9.0
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    storage:
      size: "5Gi"
      storageClassName: "standard"

  volumes:
    replicas: 3
    image: ghcr.io/whispem/minikv-volume:0.9.0
    replicationFactor: 3
    resources:
      requests:
        cpu: "200m"
