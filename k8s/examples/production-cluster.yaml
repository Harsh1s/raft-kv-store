# Production MiniKV cluster
apiVersion: minikv.io/v1alpha1
kind: MiniKVCluster
metadata:
  name: minikv-production
  namespace: minikv-prod
  labels:
    environment: production
    team: platform
spec:
  coordinators:
    replicas: 5
    image: ghcr.io/whispem/minikv-coord:0.9.0
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    storage:
      size: "50Gi"
      storageClassName: "fast-ssd"

  volumes:
    replicas: 5
    image: ghcr.io/whispem/minikv-volume:0.9.0
    replicationFactor: 3
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "16Gi"
    storage:
      size: "500Gi"
      storageClassName: "fast-ssd"

  security:
    tls:
      enabled: true
      secretName: minikv-prod-tls
    authentication:
      enabled: true
      adminSecretName: minikv-prod-admin
    encryption:
      atRest: true
      keySecretName: minikv-prod-encryption

  observability:
    metrics:
      enabled: true
      port: 9090
    tracing:
      enabled: true
      endpoint: "http://jaeger-collector.observability:14268/api/traces"

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 75
    scaleDownStabilization: 600

  backup:
    enabled: true
    schedule: "0 3 * * *"
    retention: 30
    destination:
