apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: minikvclusters.minikv.io
  annotations:
    description: "MiniKV distributed key-value store cluster"
spec:
  group: minikv.io
  names:
    kind: MiniKVCluster
    listKind: MiniKVClusterList
    plural: minikvclusters
    singular: minikvcluster
    shortNames:
      - mkv
      - minikv
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - coordinators
                - volumes
              properties:
                coordinators:
                  type: object
                  required:
                    - replicas
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 7
                      default: 3
                      description: "Number of coordinator replicas (odd number recommended for Raft)"
                    image:
                      type: string
                      default: "ghcr.io/whispem/minikv-coord:latest"
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "100m"
                            memory:
                              type: string
                              default: "256Mi"
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "1"
                            memory:
                              type: string
                              default: "1Gi"
                    storage:
                      type: object
                      properties:
                        size:
                          type: string
                          default: "10Gi"
                        storageClassName:
                          type: string
                          default: ""
                
                volumes:
                  type: object
                  required:
                    - replicas
                  properties:
                    replicas:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 3
                      description: "Number of volume server replicas"
                    image:
                      type: string
                      default: "ghcr.io/whispem/minikv-volume:latest"
                    replicationFactor:
                      type: integer
                      minimum: 1
                      maximum: 5
                      default: 3
                      description: "Data replication factor"
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "200m"
                            memory:
                              type: string
                              default: "512Mi"
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                              default: "2"
                            memory:
                              type: string
                              default: "4Gi"
                    storage:
                      type: object
                      properties:
                        size:
                          type: string
                          default: "100Gi"
                        storageClassName:
                          type: string
                          default: ""
                
                security:
                  type: object
