apiVersion: v1
kind: Namespace
metadata:
  name: minikv-system
  labels:
    app.kubernetes.io/name: minikv
    app.kubernetes.io/component: operator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minikv-operator
  namespace: minikv-system
  labels:
    app.kubernetes.io/name: minikv-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/version: "0.9.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minikv-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minikv-operator
        app.kubernetes.io/component: operator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: minikv-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: operator
          image: ghcr.io/whispem/minikv-operator:0.9.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
